name: prova_app
description: PROVA - Cognitive Error Classification Pipeline (Frontend)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # State management
  flutter_riverpod: ^2.6.1

  # Routing (matches the 4 frontend modules in Figure H-1)
  go_router: ^14.6.2

  # Networking to the Python backend (preprocessing/OCR/classifier/eval)
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  fl_chart: ^0.69.0        # confusion matrix / category frequency charts
  file_picker: ^8.1.3      # scanned page upload
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
